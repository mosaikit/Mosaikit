# SPDX-License-Identifier: MPL-2.0
#
# Pipeline: the same checks as `mvn verify` and `npm run verify` on a workstation, plus
# SonarQube, security scans and packaging. Images are pinned by tag; Renovate proposes updates.
#
# A tag vX.Y.Z (see docs/developer/release.md) also runs the release: version check, container image,
# kernel-api and its parent POM in the Maven registry, @mosaikit/sdk in the npm registry,
# the Helm chart in the Helm registry, and a GitLab release with the CHANGELOG section.

stages:
  - verify
  - quality
  - security
  - package
  - release

variables:
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  MAVEN_CLI_OPTS: --batch-mode --errors --no-transfer-progress -Dspotless.apply.skip=true
  # Testcontainers / Dev Services talk to the Docker-in-Docker service.
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  TESTCONTAINERS_HOST_OVERRIDE: docker
  HELM_VERSION: 4.3.0
  # The shared runners sometimes fail to reach the Git server of GitLab.com: try the clone again
  # before failing the job.
  GET_SOURCES_ATTEMPTS: '3'

# A newer pipeline of the same branch cancels this one (auto-cancel redundant pipelines), which
# saves compute minutes; the release jobs are not interruptible.
default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

.release:
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG

.maven:
  image: maven:3.9-eclipse-temurin-25
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/repository]

.node:
  image: node:24
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

release-check:
  extends: .release
  stage: verify
  image: node:24
  needs: []
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - bash distributions/release/check-version.sh "$VERSION"
    - bash distributions/release/release-notes.sh "$VERSION" > release-notes.md
    - test -s release-notes.md
  artifacts:
    paths: [release-notes.md]

# The frontend runs first: the kernel packages the UI that it builds. On a workstation a single
# ./mvnw verify runs both; here they run in the images that have their tools.
frontend:
  extends: .node
  stage: verify
  script:
    - npm run check
    - npm run build
  artifacts:
    paths: [coverage/, kernel/src/main/webui/dist/, plugins/*/dist/]
    expire_in: 1 week

# The documents of every commit (ADR-0023): Word and PDF guides, the compliance workbook, the
# release overview and extended notes, zipped with their checksums. The checks that the Markdown
# follows the code run in the frontend (docs/test) and backend (DocumentationTest) jobs.
docs:
  stage: verify
  needs: []
  image:
    name: pandoc/extra:3.7
    entrypoint: ['']
  before_script:
    - apk add --no-cache python3 py3-openpyxl py3-yaml font-dejavu curl
    - tlmgr install fvextra || true
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - python3 docs/build/build.py --version "${VERSION:-$CI_COMMIT_SHORT_SHA}" --output target/docs
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # The bundle of the release, which the release links to.
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "target/docs/mosaikit-docs-${VERSION}.zip" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mosaikit-docs/${CI_COMMIT_TAG}/mosaikit-docs-${CI_COMMIT_TAG}.zip"
      fi
  artifacts:
    paths: [target/docs/]
    expire_in: 1 week

# A merge request that changes the product also updates CHANGELOG.md (label no-changelog to skip).
changelog:
  stage: verify
  image: alpine/git:2.49.0
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: '0'
  script:
    - apk add --no-cache bash grep >/dev/null
    - bash distributions/release/check-changelog.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

backend:
  extends: .maven
  stage: verify
  needs: [frontend]
  services:
    - name: docker:27-dind
      alias: docker
  script:
    - mvn $MAVEN_CLI_OPTS verify -Dskip.npm
  artifacts:
    when: always
    reports:
      junit:
        - '**/target/surefire-reports/TEST-*.xml'
        - '**/target/failsafe-reports/TEST-*.xml'
    paths:
      - sdk/java/target/site/jacoco/
      - kernel/target/site/jacoco/
      - kernel/target/jacoco-report/
      # The installation and the plugin packages, input of the portable archives.
      - target/dist/
    expire_in: 1 week

sonarqube:
  extends: .maven
  stage: quality
  needs: [backend, frontend]
  variables:
    # The analysis needs the whole history to find new code and the branch a merge request targets.
    GIT_DEPTH: '0'
    SONAR_USER_HOME: $CI_PROJECT_DIR/.sonar
  cache:
    - key: maven-$CI_COMMIT_REF_SLUG
      paths: [.m2/repository]
    - key: sonar
      paths: [.sonar/cache]
  rules:
    # Runs once SONAR_TOKEN is defined (Settings > CI/CD > Variables). The scanner targets SonarQube
    # Cloud; SONAR_HOST_URL points it to a SonarQube Server instead. SONAR_ORGANIZATION and
    # SONAR_PROJECT_KEY override the keys of the root pom.xml.
    - if: $SONAR_TOKEN
  script:
    # Vitest writes paths relative to the repository root; the scanner resolves them from each Maven
    # module, so they are made absolute.
    - sed -i "s#^SF:#SF:$CI_PROJECT_DIR/#" coverage/lcov.info
    - mvn $MAVEN_CLI_OPTS -DskipTests -Dskip.npm verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      -Dsonar.qualitygate.wait=true
      ${SONAR_ORGANIZATION:+-Dsonar.organization=$SONAR_ORGANIZATION}
      ${SONAR_PROJECT_KEY:+-Dsonar.projectKey=$SONAR_PROJECT_KEY}
  allow_failure: false

secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: ['']
  needs: []
  variables:
    # The whole history: in a shallow clone the oldest commit looks as if it added every file, so a
    # finding reviewed in .gitleaksignore would come back under a different commit on every push.
    GIT_DEPTH: '0'
  script:
    - gitleaks detect --source . --no-banner --redact --verbose

dependency-scan:
  # After sbom: the Java dependencies are read from its CycloneDX file, already resolved with the
  # Maven cache. Letting Trivy resolve the pom.xml files itself downloads every parent POM from
  # Maven Central, which rate-limits the shared runners (429 Too Many Requests).
  stage: package
  image:
    # Pin by digest before production use: Trivy's supply chain was compromised in March 2026.
    name: aquasec/trivy:0.74.0
    entrypoint: ['']
  needs:
    - job: sbom
      artifacts: true
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivy
  cache:
    key: trivy
    paths: [.trivy/]
  script:
    # npm dependencies (package-lock.json), secrets and licenses of the sources.
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
      --scanners vuln,secret,license --skip-files '**/pom.xml' --skip-dirs .trivy .
    # Java dependencies of the kernel and the plugins.
    - trivy sbom --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed target/sbom.json

sast:
  stage: security
  image: semgrep/semgrep:1.175.0
  needs: []
  script:
    # The image expects the code mounted in /src when run with docker run; in CI the code is in
    # the job directory, so the Docker mode is turned off and the target is given explicitly.
    - unset SEMGREP_IN_DOCKER
    - semgrep scan --config p/java --config p/typescript --config p/owasp-top-ten --error
      --metrics off .

sbom:
  extends: .maven
  stage: package
  needs: [backend]
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests -Dskip.npm package org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
  artifacts:
    paths: [target/sbom.json]

container-image:
  extends: .release
  stage: package
  needs: [backend, release-check]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile distributions/docker/Containerfile
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --reproducible

portable:
  stage: package
  image: node:24
  needs: [backend]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - PLATFORM: [linux-x64, windows-x64, macos-arm64, macos-x64]
  cache:
    key: portable-$PLATFORM
    paths: [target/portable-cache/]
  script:
    - distributions/portable/build.sh "$PLATFORM" target/portable
    - (cd target/portable && sha256sum mosaikit-portable-* > "SHA256SUMS-$PLATFORM")
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Uploaded under the tag, the name the release links use: mosaikit-portable-vX.Y.Z-<platform>.
        for file in target/portable/mosaikit-portable-*; do
          name="$(basename "$file" | sed "s/^mosaikit-portable-[^-]*/mosaikit-portable-$CI_COMMIT_TAG/")"
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mosaikit-portable/${CI_COMMIT_TAG}/${name}"
        done
      fi
  artifacts:
    paths: [target/portable/mosaikit-portable-*, target/portable/SHA256SUMS-*]
    expire_in: 1 week

portable-test:
  extends: .maven
  stage: package
  needs:
    - job: portable
      parallel:
        matrix:
          - PLATFORM: linux-x64
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    # MK-016 acceptance test on the Linux archive, as a user would run it.
    - ARCHIVE="$(ls target/portable/mosaikit-portable-*-linux-x64.tar.gz)"
    - mvn $MAVEN_CLI_OPTS -pl kernel -am verify -Dskip.npm
      -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
      -Dit.test=PortableDistributionIT -Dfailsafe.failIfNoSpecifiedTests=false
      -Dmosaikit.it.portable="$CI_PROJECT_DIR/$ARCHIVE"

publish-maven:
  extends: [.maven, .release]
  stage: release
  needs: [backend, release-check]
  script:
    # The parent POM is published with kernel-api because plugin builds need it to resolve the API.
    - mvn $MAVEN_CLI_OPTS -s .gitlab/ci-settings.xml -DskipTests -Dskip.npm -pl .,sdk/java deploy
      -DaltDeploymentRepository=gitlab::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven

publish-npm:
  extends: [.node, .release]
  stage: release
  needs: [frontend, release-check]
  script:
    - npm run build -w sdk/js
    - REGISTRY="${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/"
    - echo "@mosaikit:registry=https:${REGISTRY}" > .npmrc
    - echo "${REGISTRY}:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    # Pre-releases (v1.2.0-rc.1) are published under the "next" dist-tag, not "latest".
    - if [[ "$CI_COMMIT_TAG" == *-* ]]; then TAG=next; else TAG=latest; fi
    - npm publish -w sdk/js --tag "$TAG"

publish-helm:
  extends: .release
  stage: release
  image: maven:3.9-eclipse-temurin-25
  needs: [release-check]
  script:
    # Helm is downloaded at a pinned version and checked against its published checksum.
    - ARCHIVE="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
    - curl --fail --silent --show-error --location --remote-name "https://get.helm.sh/${ARCHIVE}"
    - curl --fail --silent --show-error --location --remote-name "https://get.helm.sh/${ARCHIVE}.sha256sum"
    - sha256sum --check "${ARCHIVE}.sha256sum"
    - tar -xzf "$ARCHIVE" linux-amd64/helm
    - linux-amd64/helm lint distributions/k8s/mosaikit
    - linux-amd64/helm package distributions/k8s/mosaikit
    - curl --fail --silent --show-error --user "gitlab-ci-token:${CI_JOB_TOKEN}"
      --form "chart=@mosaikit-${CI_COMMIT_TAG#v}.tgz"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"

# Signatures of the release without keys to keep (NC-22): cosign signs the container image and
# the checksums of the archives and documents with the OIDC identity of this pipeline (Sigstore
# keyless); anyone verifies them with cosign verify / verify-blob and the identity of the project.
sign:
  extends: .release
  stage: release
  image: alpine:3.22
  needs:
    - container-image
    - job: portable
      artifacts: true
    - job: docs
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - apk add --no-cache cosign curl >/dev/null
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - cosign sign --yes "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - mkdir -p target/signatures
    - cat target/portable/SHA256SUMS-* target/docs/SHA256SUMS > target/signatures/SHA256SUMS
    - cosign sign-blob --yes --bundle target/signatures/SHA256SUMS.sigstore.json target/signatures/SHA256SUMS
    - |
      for file in target/signatures/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mosaikit-signatures/${CI_COMMIT_TAG}/$(basename "$file")"
      done
  artifacts:
    paths: [target/signatures/]

release:
  extends: .release
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: release-check
      artifacts: true
    - job: sbom
      artifacts: false
    - container-image
    - portable
    - portable-test
    - publish-maven
    - publish-npm
    - publish-helm
    - docs
    - sign
  script:
    - echo "Creating the GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Mosaikit $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: Container image $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
          url: $CI_PROJECT_URL/container_registry
          link_type: image
        - name: Portable for Windows x64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-portable/$CI_COMMIT_TAG/mosaikit-portable-$CI_COMMIT_TAG-windows-x64.zip
          link_type: package
        - name: Portable for Linux x64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-portable/$CI_COMMIT_TAG/mosaikit-portable-$CI_COMMIT_TAG-linux-x64.tar.gz
          link_type: package
        - name: Portable for macOS (Apple silicon)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-portable/$CI_COMMIT_TAG/mosaikit-portable-$CI_COMMIT_TAG-macos-arm64.tar.gz
          link_type: package
        - name: Portable for macOS (Intel)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-portable/$CI_COMMIT_TAG/mosaikit-portable-$CI_COMMIT_TAG-macos-x64.tar.gz
          link_type: package
        - name: Maven, npm and Helm packages
          url: $CI_PROJECT_URL/-/packages
          link_type: package
        - name: Documents (guides in Word and PDF, compliance workbook, release overview)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-docs/$CI_COMMIT_TAG/mosaikit-docs-$CI_COMMIT_TAG.zip
          link_type: package
        - name: Checksums of archives and documents, signed with Sigstore
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-signatures/$CI_COMMIT_TAG/SHA256SUMS
          link_type: other
        - name: Signature bundle of the checksums
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mosaikit-signatures/$CI_COMMIT_TAG/SHA256SUMS.sigstore.json
          link_type: other
        - name: Software bill of materials (CycloneDX)
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/target/sbom.json?job=sbom
          link_type: other
