id: MK-027
title: 'Personal settings: theme, language and active organization'
area: shell
priority: P1
status: planned
description: >-
  A settings page of the kernel lets a person choose the theme (light, dark, high contrast, themes
  of plugins), the language and the active organization; plugins add sections with the point
  settings.section. The menu of the person also switches organization and shows the presence.
acceptance:
  - Theme and language chosen by a person apply at once to the shell and to every plugin, and are kept at the next sign-in.
  - A person with several organizations switches organization from the menu without signing in again; the apps reload for that organization.
  - A section contributed by a plugin appears in the settings only for the people allowed by the plugin.
depends: [MK-017, MK-025]
