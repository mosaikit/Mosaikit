id: MK-034
title: Channels with posts, threads, mentions and reactions (app-teams)
area: plugins
priority: P1
status: planned
description: >-
  The plugin app-teams gives each team a General channel and other standard or private channels,
  with posts, threads, mentions of people and teams, reactions and cards published by plugins. See
  ADR-0027.
acceptance:
  - A post in a channel appears at once for the members who have the channel open, and a reply goes to its thread.
  - A mention notifies the person, or the members of the team, in the activity feed.
  - A private channel is visible only to its members.
depends: [MK-031, MK-032, MK-038]
