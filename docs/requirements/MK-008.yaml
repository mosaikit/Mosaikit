id: MK-008
title: Shell with sign-in, launcher and plugin apps
area: shell
priority: P1
status: done
description: >-
  The shell hosts plugin frontends and offers the apps they contribute.
acceptance:
  - People sign in with a local account.
  - The launcher lists the launcher.app contributions of active plugins with a valid route and element.
  - A plugin whose module fails to load or activate is reported and skipped.
depends: [MK-006, MK-009]
