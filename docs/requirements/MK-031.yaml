id: MK-031
title: Real-time channel from the kernel to the browser
area: kernel
priority: P1
status: planned
description: >-
  The shell keeps one WebSocket to the kernel for the active organization; plugins subscribe to
  topics and receive events committed by any request, through PostgreSQL LISTEN/NOTIFY on one node
  and NATS in a cluster. See ADR-0028.
acceptance:
  - An event published by a plugin after a commit reaches every subscribed page of the people allowed to read it within one second on one node.
  - A subscription to a topic that the person may not read is refused.
  - With two kernel nodes and NATS an event published on one node reaches the pages connected to the other.
depends: [MK-009, MK-019]
