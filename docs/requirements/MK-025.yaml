id: MK-025
title: Shell with app bar, top bar, list pane and work area
area: shell
priority: P1
status: planned
description: >-
  The shell has the structure of the web version of Teams: an app bar on the left, a top bar with
  the search and the menu of the person, a list pane and the work area; at phone width a bottom
  navigation. Plugins add apps to the bar with the point rail.app, which replaces launcher.app. See
  ADR-0026.
acceptance:
  - The app bar shows the apps of the kernel and of the active plugins in the order set for the organization, and opens each one in the work area with its own route.
  - An app contributed with launcher.app is still shown, with a deprecation warning in the plugin status.
  - At 360 px of width the app bar becomes a bottom navigation and every screen stays usable with touch.
  - No name, logo or icon of Microsoft appears in the shell.
depends: [MK-008]
