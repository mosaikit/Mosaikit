id: MK-028
title: Themes as theme plugins
area: plugins
priority: P2
status: planned
description: >-
  A plugin of kind theme brings a set of values of the theme tokens, light and dark, so that an
  installation can offer a theme of the public administration (Bootstrap Italia) or of its brand
  without changing the kernel.
acceptance:
  - Installing a theme plugin adds its theme to the settings, and the whole shell and the plugins that use the tokens follow it.
  - A theme that misses a token falls back to the value of the default theme.
depends: [MK-026, MK-027]
