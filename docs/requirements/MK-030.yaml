id: MK-030
title: Apps of the app bar per organization and role
area: plugins
priority: P1
status: planned
description: >-
  Administrators of an organization choose which apps of the active plugins appear in its app bar,
  in which order and for which roles or teams; pinned apps cannot be hidden by people.
acceptance:
  - An app disabled for an organization does not appear in its app bar, and its API refuses the people of that organization.
  - The order and the pinned apps set by the administrator are the same for every person of the organization.
depends: [MK-002, MK-025]
