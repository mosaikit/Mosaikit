id: MK-023
title: Devkit for third-party plugin developers
area: sdk
priority: P1
status: done
description: >-
  A developer outside the team creates a working plugin without reading the kernel code: the
  create-mosaikit-plugin generator writes the manifest, the frontend and, optionally, the Java
  backend with its schema under row-level security and actions for assistants, and the plugin
  development guide explains the rest. Prototype spike S8.
acceptance:
  - The generator creates a frontend-only plugin and a plugin with a Java backend, whose manifests the kernel accepts.
  - The generated Java plugin builds with Maven against the published plugin API and is accepted by the kernel.
  - The guide covers creating, building, trying, signing and publishing a plugin.
depends: [MK-005, MK-011, MK-019]
